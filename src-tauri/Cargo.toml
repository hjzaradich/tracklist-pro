[package]
name = "tracklist-pro"
version = "0.1.11"
description = "Builds a DJ's Library and keeps it in step with rekordbox"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collide on Windows (rust-lang/cargo#8519).
name = "tracklist_pro_lib"
# The Windows app, the tests and the examples use only the rlib. Tauri's
# mobile template also lists staticlib and cdylib; mobile is never built here
# (audit 1cB, B17). Restore them if a mobile target is ever added.
crate-type = ["rlib"]

# The preview seed's own tests (they seed a temp folder) run with the suite.
[[example]]
name = "preview_seed"
test = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# specta and tauri-specta are pre-release: pin exactly, as their docs require.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# `backup`: the online-backup API for the portability bundle (ROADMAP 4.1),
# used only inside the write guard.
rusqlite = { version = "0.41", features = ["bundled", "hooks", "backup"] }
sha2 = "0.10.9"
lofty = "0.25.4"
unicode-normalization = "0.1"
# HTTP client for the net module only (ROADMAP 0.1, network gate).
ureq = { version = "3.4.2", default-features = false, features = ["native-tls-no-default"] }
serde_json = "1"
quick-xml = "0.42"
# Wishlist CSV files, such as Exportify's (2B-W1). Unlicense OR MIT.
csv = "1"
# The optional rekordbox library database reader (ROADMAP 2.7) decrypts its
# own staged copy in pure Rust. MIT OR Apache-2.0.
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# The rekordbox XML file picker (1aB-11); the webview may only open it.
tauri-plugin-dialog = "2"
# Whole-file and audio-only hashes (1aB-5, 1aB-6).
blake3 = "1"
# The per-root music folder watcher (1aC-6). CC0-1.0.
notify = "8"
# Where the user's Downloads folder is (the Windows known folder; fragile
# locations, 1aD-7). MIT OR Apache-2.0.
dirs = "7"
# The user's own Discogs token lives in the operating system's password store
# (ROADMAP 2.2), never in the database. keyring-core is the keyring project's
# store-neutral core (MIT OR Apache-2.0); its mock store backs every test. The
# `keyring` facade crate is not used: it pulls a Secret Service client on
# Linux, and Linux has no store here.
keyring-core = "1.0.1"
# URL-safe base64 for the AcoustID fingerprint (ROADMAP 2.2). MIT OR Apache-2.0.
base64 = "0.22"
# Acoustic fingerprints (ROADMAP 1.4). MIT.
rusty-chromaprint = "0.3.0"
# Decodes audio for fingerprints (ROADMAP 1.4, §5.6). MPL-2.0. Opus isn't among its codecs.
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "all-meta", "mp3", "aac", "alac", "flac", "pcm", "adpcm", "vorbis", "isomp4", "ogg", "wav", "aiff", "caf"] }
# The spectral cutoff of a file's audio (ROADMAP 1.6). MIT OR Apache-2.0. Already in the tree through rusty-chromaprint.
rustfft = "6.4.1"
# Integrated loudness of a track (ROADMAP 3.7, the energy suggestion). MIT.
ebur128 = "0.1.11"
# The listening step (ROADMAP 3.8): CED-tiny run on the CPU in pure Rust. MIT OR Apache-2.0.
tract-onnx = "0.23.10"
# Resamples a window to the model's 16 kHz (ROADMAP 3.8). MIT. Already in the tree through rusty-chromaprint.
rubato = "0.16.2"
# The portability bundle is a .zip (ROADMAP 4.1). MIT. Deflate only, through
# flate2 (already in the tree).
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
# The Windows version for the diagnostics report (4.3). Already in the tree
# through tauri. MIT OR Apache-2.0.
windows-version = "0.1.7"
# Windows Credential Manager for keyring-core (ROADMAP 2.2). MIT OR Apache-2.0.
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# The macOS keychain for keyring-core (ROADMAP 2.2). MIT OR Apache-2.0.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[features]
# Makes `Credentials::native()` give the in-memory mock store, as it does in
# unit tests (`cfg(test)`), which integration tests under tests/ do not get.
# Never in a release build: only the dev-dependency below turns it on.
test-store = []

[dev-dependencies]
# Integration tests (tests/*.rs) compile the library without `cfg(test)`; this
# line gives them the mock password store (see `test-store` above), so no test
# can reach a real OS store.
tracklist-pro = { path = ".", features = ["test-store"] }
tauri = { version = "2", features = ["test"] }
serde_json = "1"
tempfile = "3"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# Tests drop the backup privilege an admin token may hold (scan tests) and
# read the process's peak working set (tests/perf_100k.rs). LAME 3.100
# (LGPL) makes real MP3s of generated audio in fingerprint tests; Windows
# only, since elsewhere it needs autotools.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }
mp3lame-encoder = "=0.2.5"

# Debug info for dev and test builds: line tables only for our own code, so
# panics and backtraces still show file and line; none for dependencies. Full
# debug info made each test binary's PDB huge and slowed every link (audit
# 1cB, A13). To inspect variables in a debugger, set these to 2 locally.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# SQLite (compiled from C by libsqlite3-sys), sha2 and blake3 run in most
# tests (migrations, hashing); unoptimized they dominate test time (audit
# 1cB, B16). Dev and test builds only.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3

# Fingerprinting (1aB-7) decodes and analyzes minutes of audio per test;
# unoptimized, these crates run 10-20x slower. Dev and test builds only.
[profile.dev.package.rusty-chromaprint]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-caf]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3

# The listening step (3.8) runs CED-tiny on the CPU through tract: about 20 s
# of audio per window, so unoptimized the model tests crawl. Dev and test builds only.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-extra]
opt-level = 3
[profile.dev.package.tract-transformers]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
