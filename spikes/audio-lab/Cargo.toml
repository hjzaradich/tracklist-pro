[package]
name = "audio-lab"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 0 spike: fingerprinting, BPM/key estimates and fake-320 detection (see EXPERIMENTS.md)."

[dependencies]
anyhow = "1"
serde_json = "1"
rusty-chromaprint = "*"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = ["mpa", "aac", "alac", "isomp4", "aiff", "caf"] }
